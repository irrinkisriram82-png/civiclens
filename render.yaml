services:
  - type: web
    name: civiclens
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk: { name: data, mountPath: /var/data, sizeGB: 1 }
    envVars:
      - { key: DATA_DIR, value: /var/data }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: OFFICER_PASSWORD, sync: false }
      - { key: MAP_LAT, value: "18.7625" }
      - { key: MAP_LNG, value: "84.4195" }
